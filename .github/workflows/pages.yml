name: Deploy NMR Atlas to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check assets/core.js
          node --check assets/periodic.js
          node --check assets/isotope-details.js
          node --check assets/references.js
          node --check assets/app.js
      - name: Check inspector isotope catalogue
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('assets/isotope-details.js','utf8');
          const {isotopeCatalogue,inspectorIsotopes} = await import('data:text/javascript,'+encodeURIComponent(source));
          const se=inspectorIsotopes({symbol:'Se',isotopes:[{mass:'77',spin:'1/2',gamma:8.13,receptivity:1}]});
          const c=inspectorIsotopes({symbol:'C',isotopes:[{mass:'13',spin:'1/2',gamma:10.71,receptivity:1}]});
          if(se.length!==7 || se.find(i=>Number(i.mass)===74)?.spin!==0 || se.find(i=>Number(i.mass)===77)?.receptivity!==1)
            throw new Error('Selenium isotope merge failed');
          if(c.length!==3 || c.find(i=>Number(i.mass)===12)?.spin!==0 || c.find(i=>Number(i.mass)===13)?.gamma!==10.71)
            throw new Error('Carbon isotope merge failed');
          if(Object.values(isotopeCatalogue).flat().some(i=>i.mass<=0 || (i.spin===0&&i.gamma!==null)))
            throw new Error('Invalid isotope placeholder or spin-zero gamma');
          NODE
      - name: Check selector collection usage
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = ['assets/app.js','assets/core.js','assets/periodic.js','assets/references.js'];
          // $() returns one Element; $$() returns a collection.
          // Match direct .forEach calls on single-element selector results.
          const invalid = /(?<!\$)\$\([^)]*\)\s*\.forEach\s*\(/g;
          const badExample = "$('#paletteMenu .palette-option').forEach(x => x)";
          const goodExample = "$$('#paletteMenu .palette-option').forEach(x => x)";
          if (!badExample.match(invalid) || goodExample.match(invalid)) {
            throw new Error('Selector validation self-test failed');
          }
          const bad = [];
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            for (const hit of source.matchAll(invalid)) {
              const lineNo = source.slice(0, hit.index).split('\n').length;
              bad.push(`${file}:${lineNo}: ${hit[0]}`);
            }
          }
          if (bad.length) {
            console.error('Single-element selector used with forEach:\n' + bad.join('\n'));
            process.exit(1);
          }
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
